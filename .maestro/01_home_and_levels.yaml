# Home screen and level picker work on a fresh install.
appId: ${APP_ID}
name: Home and level select
---
- runFlow: common/launch_fresh.yaml
- assertVisible: "Arrow Flow"
- assertVisible:
    id: "play-button"
- assertVisible: "Play level 1"
- tapOn:
    id: "levels-button"
- assertVisible: "Levels"
- assertVisible: "Level 1, 0 stars"
- assertVisible: "Level 2, locked"
- tapOn: "Level 1, 0 stars"
- assertVisible: "Level 1"
- assertVisible:
    id: "board"
- tapOn:
    id: "back-button"
- assertVisible: "Play level 1"
