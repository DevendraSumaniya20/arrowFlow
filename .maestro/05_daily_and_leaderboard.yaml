# Needs the API running locally (cd server && npm run dev).
# Joins the leaderboard, clears today's daily challenge, and finds the
# verified result ranked on the Today board.
appId: ${APP_ID}
name: Daily challenge and leaderboard
---
- runFlow: common/launch_fresh.yaml
- tapOn:
    id: "leaderboard-button"
- assertVisible: "Join the leaderboard"
- tapOn:
    id: "nickname-input"
- inputText: "Tester"
- inputRandomNumber:
    length: 4
# Return submits the form (works on both keyboards, unlike hideKeyboard on iOS).
- pressKey: Enter
- extendedWaitUntil:
    visible: "Playing as.*"
    timeout: 15000
- tapOn:
    id: "back-button"
- tapOn:
    id: "daily-button"
- extendedWaitUntil:
    visible: "3 of 3 lives"
    timeout: 15000
- assertVisible: "Daily challenge"
- repeat:
    times: 200
    while:
      notVisible: "Daily cleared!"
    commands:
      # Optional: after the last tap the board is empty while the arrow flies off.
      - tapOn:
          id: "arrow-free"
          index: 0
          optional: true
- assertVisible: "Daily cleared!"
- extendedWaitUntil:
    visible: "You're #[0-9]+ today"
    timeout: 15000
- tapOn:
    id: "leaderboard-cta"
- assertVisible: "Today's daily challenge.*"
# Earlier runs leave tied players on a local database, so scroll to our row.
- scrollUntilVisible:
    element:
      id: "my-rank-row"
    direction: DOWN
    timeout: 20000
    visibilityPercentage: 50
