# Settings survive a restart, opening them mid-game keeps the game,
# and reset progress asks before clearing.
appId: ${APP_ID}
name: Settings persist and reset progress
---
- runFlow: common/launch_fresh.yaml
- tapOn:
    id: "settings-button"
- assertVisible: "Settings"
- assertVisible:
    id: "sound-switch"
    checked: true
- tapOn:
    id: "sound-switch"
- tapOn:
    id: "vibration-switch"
- tapOn:
    id: "appearance-dark"
- assertVisible:
    id: "sound-switch"
    checked: false
- tapOn:
    id: "settings-close"
- stopApp
- runFlow: common/launch_keep.yaml
- tapOn:
    id: "play-button"
- tapOn:
    id: "arrow-blocked"
    index: 0
- assertVisible: "2 of 3 lives"
- tapOn:
    id: "settings-button"
- assertVisible:
    id: "sound-switch"
    checked: false
- assertVisible:
    id: "vibration-switch"
    checked: false
- assertVisible:
    id: "appearance-dark"
    selected: true
- tapOn:
    id: "settings-close"
- assertVisible: "2 of 3 lives"
- tapOn:
    id: "back-button"
- tapOn:
    id: "settings-button"
- tapOn:
    id: "reset-button"
- assertVisible: "Reset progress?"
- tapOn: "(?i)cancel"
- tapOn:
    id: "reset-button"
- tapOn: "(?i)reset"
- tapOn:
    id: "settings-close"
- assertVisible: "Play level 1"
